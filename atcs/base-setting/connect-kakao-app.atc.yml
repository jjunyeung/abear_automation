title: 연결설정 / 카카오톡 페이지 + 연결 해제 모달 (TC 3408/3410/3419/3423/3424/3428)
priority: P0

description: |
  /view3/connect?setting=KAKAO_APP 진입 → 3 섹션 헤더 + 카카오 계정 연결하기 / 채널 친구 추가하기 /
  2 알림 토글 노출 확인. 연결된 환경이면 연결 해제 버튼 → DisConnectModal 오픈 → 취소.
  미연결 환경이면 모달 흐름 skip success.
  TC 원본: Case No 3408, 3410, 3419, 3423, 3424, 3428 / P0.

inputs: {}

steps:
  - id: enter_kakao_app_connect
    do: 카카오톡 연결 페이지 진입

  - id: verify_section_headers
    do: 3 섹션 헤더 (카카오톡 계정 연결 설정 / 채널 친구 추가 / 알림 받기 기능 활성화 확인) 노출 확인

  - id: verify_connect_buttons
    do: 카카오 계정 연결하기 버튼 + 채널 친구 추가하기 버튼 노출 확인

  - id: verify_alert_toggles_labels
    do: 주문알림 받기 + AI 전세계 상품수집 완료알림 받기 라벨 노출 확인

  - id: open_disconnect_modal_or_skip
    do: 연결된 환경이면 연결 해제 버튼 클릭 → DisConnectModal 오픈. 미연결이면 skip success.

  - id: close_disconnect_modal_or_skip
    do: 모달 노출 시 취소 버튼 클릭 → 모달 닫힘 확인. skip 케이스는 noop.

expected: 페이지 + 섹션 + 버튼 + 토글 라벨 노출. 환경 따라 모달 open/close 검증. unhandled 0건.
