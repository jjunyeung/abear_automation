title: 기본 설정 > 공통설정 > 마켓별 가중치 → 단일 마켓만 변경 → 영속성

description: |
  /view3/base-setting?category=MARKET_WEIGHT 진입 → 6개 마켓 input 중 첫 항목 (보통 스마트스토어) 만 +1 변경 + onBlur 저장 + reload 후 값 유지 확인.

  verify-market-weights-on-product 의 base setting 변경 부분을 분리한 단건.

inputs: {}

steps:
  - id: open_weight
    do: /view3/base-setting?setting=COMMON&category=MARKET_WEIGHT 진입 + 마켓 input 마운트
  - id: bump_first_market
    do: 첫 마켓 (스마트스토어) input +1 → Tab → 저장 대기
  - id: verify_persist
    do: page.reload() 후 첫 마켓 input 값 유지 확인

expected: 기본 설정 마켓별 가중치 단일 마켓 변경 + 영속성 검증. unhandled 0건.
