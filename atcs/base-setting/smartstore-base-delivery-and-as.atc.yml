  - id: open_return_dropdown
    do: 반품지 목록 드롭다운 열기

  - id: verify_post_company_dropdown_visible
    do: 택배사 드롭다운 노출 확인

  - id: open_post_company_dropdown
    do: 택배사 드롭다운 열기

  - id: verify_as_phone_field_visible
    do: A/S 전화번호 입력 필드 노출 확인

  - id: verify_as_phone_field_editable
    do: A/S 전화번호 input 이 disabled 아님 (입력 가능) 확인

expected: 모든 영역 노출 + dropdown 열림 동작 + A/S 전화번호 input 가능. 데이터 변경 없음. unhandled 0건.
