title: 스마트스토어 / 배송 및 A/S 화면 진입 + 영역 노출 검증 (TC 3467/3471-3476/3487/3488)
priority: P0

description: |
  /view3/base-setting?setting=SMARTSTORE&category=DELIVERY_AND_AS 진입 → 출고지 / 반품지 /
  택배사 드롭다운 + A/S 전화번호 input 노출 확인 + dropdown 열림 동작.
  관부가세 (TC 3482-3484) 는 COMMON 화면에 있어 별도 ATC. 저장 (3492/3493) destructive skip.
  TC 원본: Case No 3467, 3471-3476, 3487, 3488 / P0.

inputs: {}

steps:
  - id: enter_smartstore_delivery_and_as
    do: 스마트스토어 배송 및 A/S 페이지 진입 - 배송 및 A/S 탭 활성 확인

  - id: verify_outbound_dropdown_visible
    do: 출고지 목록 드롭다운 노출 확인

