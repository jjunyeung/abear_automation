# 기본설정 톡스토어 구매 포인트 토글 ON 시 적립 단위/적립액 필드 노출.
#
# TC 원본:
#   - Case No 1048 / 기본설정 › 톡스토어 › 리뷰 포인트 / P0 (원 드롭다운 노출)
#   - Case No 1049, 1050 / 기본설정 › 톡스토어 › 리뷰 포인트 / P0 (원/% 선택 — drop down 옵션)
#   - Case No 1051, 1052, 1057 / 기본설정 › 톡스토어 › 리뷰 포인트 / P0 (적립액 input 노출)
