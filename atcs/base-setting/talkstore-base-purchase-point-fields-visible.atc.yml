# 자동화 범위: 토글 ON → "포인트 적립 단위(원/%)" + "포인트 적립액(률)" 필드 노출 검증 + 토글 OFF 원복.

title: 구매 포인트 토글 ON 시 필드 노출
priority: P2

description: |
  리뷰 포인트 탭 → 구매 시 포인트 토글 ON → "포인트 적립 단위(원/%)" 드롭다운 + "포인트 적립액(률)" input 노출 → 토글 OFF.
  TC 원본: Case No 1048, 1049, 1050, 1051, 1052, 1057 / P0

inputs: {}

steps:
  - id: goto_review_point_tab
    do: 기본설정 톡스토어 리뷰 포인트 탭 진입

  - id: enable_purchase_point
    do: 구매 시 포인트 지급 토글 ON

  - id: verify_unit_dropdown_visible
    do: 포인트 적립 단위 드롭다운 라벨 노출 검증

  - id: verify_amount_input_visible
    do: 포인트 적립액 input 노출 검증

  - id: disable_purchase_point
    do: 구매 시 포인트 지급 토글 OFF 원복

expected: 토글 ON 시 필드 노출. unhandled 0건.
