# 기본설정 톡스토어 리뷰 포인트 탭 — 구매 시 포인트 적립 단위/액 입력 검증.
#
# TC 원본 (P0, 5건):
#   - Case No 1050 / 리뷰 포인트 / % 선택       (포인트 적립 단위(원/%) 드롭다운 → "%" 선택)
#   - Case No 1052 / 리뷰 포인트 / 원 적립액 입력  (TextField — type=AMOUNT 모드, 단위 "원")
#   - Case No 1057 / 리뷰 포인트 / 원 적립액 입력  (위와 동일 입력 — 재시도/검증)
#   - Case No 1060 / 리뷰 포인트 / % 적립율 입력  (TextField — type=RATE 모드, 단위 "%")
#   - Case No 1061 / 리뷰 포인트 / % 적립율 입력  (위와 동일)
#
# 코드 출처: windly-frontend-web/src/features/BaseSetting/Talkstore/ReviewPoint/index.tsx
#   - Toggle "구매 시 포인트 지급 여부 설정" (talkstoreIsPurchasePointGranted)
#   - ON 일 때만 Dropdown "포인트 적립 단위(원/%)" + TextField "포인트 적립액(률)" 노출
#   - Dropdown 옵션: { label: '원', value: 'AMOUNT' } / { label: '%', value: 'RATE' }
#   - TextField 단위: type=RATE 면 '%', type=AMOUNT 면 '원'
#
# CASES — spec 가 case 별 (단위 변경 / 액 입력 / 율 입력) 다르게 처리.

title: 기본설정 톡스토어 구매 포인트 적립 단위/액 입력
priority: P0

description: |
  리뷰 포인트 탭 → 구매 시 포인트 ON 보장 → 적립 단위 드롭다운에서 원/% 선택 +
  적립액/적립율 TextField 입력 검증.
  TC 원본: Case No 1050, 1052, 1057, 1060, 1061 / P0

inputs: {}

steps:
  - id: goto_review_point_tab
    do: 기본설정 톡스토어 리뷰 포인트 탭 진입

  - id: ensure_purchase_point_on
    do: 구매 시 포인트 지급 여부 설정 토글 강제 ON (이미 ON 이면 noop)

  - id: do_case_action
    do: case 별 액션 — 단위 dropdown 선택 또는 적립액/율 TextField 입력

expected: 단위 선택 반영 + 액/율 입력 반영. unhandled 0건.
