title: 수집상품 목록 → 페이지 사이즈 변경 → 카드 갯수 늘어남 확인

description: |
  수집상품 목록의 페이지 사이즈 dropdown (20/40/60 등) 을 더 큰 값으로 변경 → 카드 갯수가 늘어났는지 확인.

  현재 페이지에 충분히 많은 상품이 있어야 (≥40 추천) 의미 있는 검증.

inputs: {}

steps:
  - id: open_collected_list
    do: 좌측 사이드바 수집상품 메뉴 클릭
  - id: change_size
    do: 페이지 사이즈 dropdown 클릭 → 더 큰 값 선택 → 카드 갯수 증가 확인
