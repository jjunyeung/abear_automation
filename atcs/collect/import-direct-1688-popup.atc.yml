# 상품 수집 페이지의 "1688" 버튼 클릭 → 새 창으로 1688 도메인 열림 검증
# 사전조건: setup project (tests/auth.setup.ts) 가 로그인 + 해구대 진입 완료.
# Helper: verifySourcingMallPopup (lib/windly-actions.ts)

title: 상품 수집 - 1688 버튼 클릭 시 새 창으로 1688 열림 검증

description: |
  윈들리 "상품 수집" 페이지의 "1688" 직진입 버튼이 정상 동작하는지 검증.
  버튼을 누르면 새 탭이 열리고 그 탭의 URL 이 1688.com 도메인인지 확인.

  입력값 없음 — setup project 가 로그인 + 해구대 진입까지 마친 상태에서 바로 실행.
  새 탭이 안 열리거나 다른 도메인이면 fail.
inputs: {}

steps:
  - id: open_collect_menu
    do: 좌측 사이드바 "상품 수집" 메뉴 클릭하여 /view3/product-import 진입
  - id: click_mall_verify_popup
    do: 1688 SourcingMallButton 클릭하고 새 탭이 열리는지 + URL hostname 매치 확인

expected: 1688 버튼 클릭 → 새 탭 + 정상 도메인. unhandled 0건.
