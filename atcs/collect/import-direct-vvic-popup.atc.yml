# 상품 수집 페이지의 "VVIC" 버튼 클릭 → 새 창으로 VVIC 도메인 열림 검증
# 사전조건: setup project (tests/auth.setup.ts) 가 로그인 + 해구대 진입 완료.
# Helper: verifySourcingMallPopup (lib/windly-actions.ts)

title: 상품 수집 - VVIC 버튼 클릭 시 새 창으로 VVIC 열림 검증

description: |
  윈들리 "상품 수집" 페이지의 "VVIC" 직진입 버튼 검증.
  클릭 시 새 탭이 VVIC 도메인으로 열리는지 확인.

  입력값 없음.
inputs: {}

steps:
  - id: open_collect_menu
    do: 좌측 사이드바 "상품 수집" 메뉴 클릭하여 /view3/product-import 진입
  - id: click_mall_verify_popup
    do: VVIC SourcingMallButton 클릭하고 새 탭이 열리는지 + URL hostname 매치 확인

expected: VVIC 버튼 클릭 → 새 탭 + 정상 도메인. unhandled 0건.
