title: 상품 수집 → URL 수집 모달 열기 → 취소 → 모달 닫힘

description: |
  상품 수집 페이지의 URL 수집 카드 클릭 → 모달 오픈 → 취소 / 닫기 버튼 클릭 → 모달이 닫히는지만 확인하는 side-effect free smoke test.

  수집 자체는 하지 않으므로 반복 실행 안전 + URL history 미사용.

inputs: {}

steps:
  - id: open_collect_menu
    do: 좌측 사이드바 상품 수집 메뉴 클릭하여 /view3/product-import 진입
  - id: open_modal
    do: URL 수집 카드 클릭하여 모달 오픈 + textarea/input 노출 확인
  - id: cancel_modal
    do: 모달 안의 취소/닫기 버튼 클릭 → 모달이 사라지는지 확인 (textarea hidden)
