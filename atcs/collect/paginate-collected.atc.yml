# 수집상품 목록에서 N번 페이지로 이동
#
# 흐름:
#   (1) 수집상품 메뉴 진입 → (2) "페이지 이동" input 으로 N 페이지 jump
#
# 사전조건: setup project (tests/auth.setup.ts) 가 로그인 + 해구대 진입을 완료한 상태.
#
# 입력:
#   - page_number : 이동할 페이지 번호 (1-indexed)

title: 수집상품 목록 페이지네이션 이동

description: |
  수집상품 목록의 페이지네이션 동작 검증.
  "페이지 이동" input 에 N 입력 → Enter 누르면 첫 카드의 href 가 변경되는지로 페이지 전환을 확인.

  입력: page_number (이동할 페이지 번호, 1-indexed).
  사전조건: 수집상품에 N+ 페이지 분량의 카드가 이미 있어야 함.
inputs:
  page_number:
    type: number
    description: 이동할 페이지 번호 (1-indexed)
    example: '3'

steps:
  - id: open_collected_list
    do: 좌측 사이드바 수집상품 메뉴 클릭

  - id: goto_page
    do: 페이지네이션의 "페이지 이동" input 에 inputs.page_number 입력 후 Enter. 첫 카드 href 가 바뀌면 전환 성공
    expect: 첫 카드 href 가 페이지 이동 전과 다름

expected: N번 페이지의 카드가 노출됨. unhandled 0건.
