title: 수집상품 목록 → 카드뷰 ↔ 목록뷰 전환

description: |
  수집상품 목록의 카드뷰/목록뷰 전환 버튼을 클릭하여 표시 형태가 바뀌는지 확인.

  카드 형태와 목록(테이블) 형태의 DOM 구조가 다르므로, 클릭 전/후 페이지의
  특정 element 출현 여부 변화로 전환 동작을 검증.

  windly 수집상품에 정렬 기능은 없고 카드뷰/목록뷰 전환 + 페이지 이동이
  목록 페이지의 주된 UX (사용자 확인).

inputs: {}

steps:
  - id: open_collected_list
    do: 좌측 사이드바 수집상품 메뉴 클릭
  - id: toggle_view
    do: 카드뷰 ↔ 목록뷰 전환 버튼 클릭 → 페이지 DOM 구조 변화 확인 (카드 → table 또는 그 반대)
