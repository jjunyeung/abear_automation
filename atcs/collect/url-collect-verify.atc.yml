# url-collect 의 확장: 수집 완료 → 수집상품 이동 → 수집중 카드 ready 대기 → 상품 진입.
#
# 흐름:
#   (1) 상품 수집 메뉴  →  (2) URL 수집 카드  →  (3) URL 입력 + 수집
#   →  (4) BulkImportTable row 가 SpinLoader → CheckIcon 으로 전환 대기
#   →  (5) 닫기 (모달 자체가 /view2/interested-product 로 자동 navigate)
#   →  (6) 첫 카드가 ProductImportingCard (수집중) → 정식 ProductCard (이미지+제목) 로
#         전환될 때까지 대기
#   →  (7) 첫 카드 클릭하여 상품 detail 진입 + 페이지 mount 확인
#
# 사전조건: setup project (tests/auth.setup.ts) 가 로그인 + 해구대 진입 완료.
#
# 입력 (D8): env / CLI 로 매 실행마다 새 URL 필수 (url-collect 와 동일 정책).

title: URL 수집 → 수집중 ready 대기 → 상품 detail 진입 (사용자 지정 링크)

description: |
  url-collect 의 확장 버전. 수집 완료까지만 보지 않고 수집상품 목록까지 이동해 카드가 "수집중" → 정식 ProductCard 로 전환됐는지, 그 카드 클릭 시 상품 detail 이 mount 되는지까지 끝까지 검증.

  흐름: URL 수집 → BulkImportTable spinner → CheckIcon → 자동 navigate /view2/interested-product → ProductImportingCard → ProductCard 전환 대기 → 첫 카드 클릭하여 상세 진입 + mount 확인.

  입력: product_url (매 실행마다 새 URL 필수).
inputs:
  product_url:
    type: string
    description: 수집할 상품 URL. 매 실행마다 새 값 필수 (재사용 금지). GUI 의 URL 풀에서 head 1개씩 자동 consume.
    from: pool

steps:
  - id: open_collect_menu
    do: 좌측 사이드바 상품 수집 메뉴 클릭하여 view3/product-import 진입

  - id: open_url_collect
    do: 상품 수집 페이지의 URL 수집 카드 클릭하여 모달 오픈

  - id: submit_url
    do: URL 입력 필드에 inputs.product_url 입력 후 수집 실행 버튼 클릭

  - id: wait_completion
    do: BulkImportTable row 의 SpinLoader (a.importing) 가 사라지고 체크 아이콘 (a.success) 으로 바뀔 때까지 대기. error 아이콘 (a.fail) 이면 fail. 최대 5분.

  - id: close_modal_goto_collected
    do: 모달의 닫기 버튼 클릭 — modalStatus complete 시 자동으로 view2/interested-product 로 navigate.

  - id: wait_first_card_ready
    do: 페이지의 "수집중" 텍스트가 모두 사라질 때까지 대기 (ProductImportingCard → ProductCard 전환). 첫 .product-card 의 이미지 (img[alt='']) 와 제목 텍스트가 visible 인지 확인.

  - id: enter_product_detail
    do: 첫 .product-card 클릭하여 view2/interested-product/<digits> URL 도달 + detail 페이지 mount (img 존재) 확인.

expected: 7개 step 모두 success, unhandled 0건. 수집중 카드가 ready 로 전환되고 상품 detail 진입 가능.
