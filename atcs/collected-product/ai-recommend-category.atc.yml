title: 수집상품 첫 카드 → AI 카테고리 추천 → 호출 성공 확인

description: |
  수집상품 첫 카드 → 상세 진입 → 기본 정보 탭 → "AI 카테고리 추천" 버튼 클릭 → 로딩 종료 → rate-limit/네트워크 에러 토스트 없으면 PASS.

  카테고리 input 값 비교는 카테고리가 dropdown 으로 표시되어 검증 어려움 — 에러 토스트 부재로 호출 성공만 본다.

inputs: {}

steps:
  - id: open_collected_list
    do: 좌측 사이드바 수집상품 메뉴 클릭
  - id: open_first_product
    do: 첫 .product-card 클릭하여 상세 진입
  - id: recommend_category
    do: 기본 정보 탭 → AI 카테고리 추천 버튼 클릭 → 로딩 종료 + 에러 토스트 없는지 확인

expected: AI 카테고리 추천 API 호출 성공. unhandled 0건.
