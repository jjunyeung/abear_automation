# 수집상품 일괄 도구 — 카테고리&태그 변경 / 상품명 변경 모달 노출 검증.
#
# TC 원본 (P0, 6건 + destructive 1건 skip):
#   - Case No 1098 / 카테고리/태그 일괄 변경 (모달 노출)
#   - Case No 1099 / 카테고리/태그 일괄 변경 적용 — destructive, skip (실 상품 카테고리 변경)
#   - Case No 1100 / 상품명 일괄 수정 (모달 노출)
#   - Case No 1101-1104 / 상품명 일괄 수정 (sub flow variations — 모달 안 동작)
#
# 코드 출처: windly_repo/sesame/src/features/InterestedProduct/InterestedProduct.tsx
#   - "카테고리&태그 변경" Tooltip + EditIcon button → ProductBulkChangeModal
#   - ... More 메뉴 → "상품명 변경" AnchoredModalItem → TitleBulkChangeModal
#
# 검증 전략: 카드 선택 → 메뉴/버튼 클릭 → 모달 열림 → 취소로 닫힘 확인. 적용 X.

title: 수집상품 일괄 → 카테고리/태그 + 상품명 변경 모달 노출 검증
priority: P0

description: |
  수집상품 카드 1+ 선택 → (a) 카테고리&태그 변경 버튼 클릭 → 모달 열림 → 닫기
  → (b) ... 메뉴 → 상품명 변경 → 모달 열림 → 닫기.
  TC 원본: Case No 1098, 1100-1104 / P0

inputs: {}

steps:
  - id: goto_collected_products
    do: 수집상품 목록 페이지 진입

  - id: select_first_card
    do: 첫 상품 카드 체크박스 선택

  - id: open_bulk_modal
    do: case 별 — 카테고리&태그 변경 버튼 또는 ... 메뉴 상품명 변경 클릭

  - id: verify_modal_opened
    do: 해당 모달 열림 확인 (title 매칭)

  - id: close_modal
    do: 취소 또는 X 버튼으로 모달 닫기

expected: 두 모달 모두 열림 + 닫힘 동작. unhandled 0건. 상품 데이터 변경 없음.
