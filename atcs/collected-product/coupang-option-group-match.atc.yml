title: 쿠팡 필수 옵션그룹명 매칭 (태그 매칭 + 필수 추가영역 + 옵션가 기준 선택)
priority: P0
description: |
  쿠팡이 옵션그룹명을 "필수"로 강제(2026-07 UI 개정: 사용 토글 폐기, 매칭 상시 노출).
  수집상품의 각 옵션그룹을 쿠팡 카테고리가 요구하는 필수 옵션그룹명 Tag 에 매칭한다.
  - 윈들리가 그룹명 기준으로 자동 매칭한 건(색상 그룹→색상 등)은 그대로 두고,
    미선택 그룹만 남는 필수명으로 채운다 (비파괴).
  - 내 옵션그룹 수 보다 필수 수가 많으면: 그룹을 추가하지 않고, 화면 하단에 뜨는
    "쿠팡 필수 옵션그룹 추가" 영역의 옵션값에 아무 숫자만 넣어 채운다.
  - 그 뒤 판매가 탭에서 옵션가 기준(base SKU) 을 선택.
  업로드는 본 TC 가 하지 않음. 큐의 이어지는 업로드 TC 가 진행한다.
  전제: 대상 상품은 아직 업로드되지 않았고, 쿠팡이 업로드 대상 마켓이며,
  쿠팡 카테고리에 필수 옵션그룹명이 존재해야 한다.
inputs:
  source_product_id:
    type: string
    description: 매칭 대상 수집상품의 윈들리 내부 코드. 비우면 목록 첫 카드 사용.
    example: '235442266'
    from: previous
outputs:
  source_product_id:
    type: string
    description: 매칭한 상품 코드 — 이어지는 업로드 TC 가 받아감
steps:
  - id: open_collected_list
    do: 수집상품 목록으로 이동
  - id: open_target_product
    do: source_product_id 가 있으면 상품 코드 검색으로 진입, 없으면 첫 카드 진입. 진입한 상품 코드를 output 으로 발급
  - id: open_option_tab
    do: 상품 상세에서 옵션 탭으로 이동
  - id: match_option_groups
    do: 쿠팡 필수 옵션그룹명 매칭 행이 뜰 때까지 기다린다(없으면 쿠팡 미타겟/필수 없음으로 실패). 윈들리가 그룹명 기준으로 자동 선택한 필수 태그는 그대로 두고, 아직 아무 필수명도 선택 안 된 그룹만 남는 필수명을 순서대로 클릭해 채운다(그룹 추가/삭제는 하지 않음). 내 그룹 수보다 필수 수가 많아 하단에 쿠팡 필수 옵션그룹 추가 영역이 뜨면 그 옵션값에 아무 숫자를 입력한다. 마지막으로 모든 실제 그룹에 윈들리 A-Z 버튼으로 옵션명을 알파벳 정규화하고 옵션값을 단위형식·고유성 기준으로 자동보정한다
    expect: 모든 실제 옵션그룹이 필수명에 매칭되고, 필수 추가영역이 있으면 옵션값이 채워짐 + 옵션명(A-Z)/옵션값 채워짐
  - id: select_base_sku
    do: 판매가 탭으로 이동해 옵션가 기준 라디오에서 아무 SKU 나 하나 선택
    expect: 옵션가 기준이 선택되어 옵션가 기준을 선택해주세요 경고가 사라짐
  - id: error_check
    do: 상단 에러체크 버튼을 눌러 에러체크를 실행하고, 탭 dot 상태를 읽어 이 TC 의 책임 탭(옵션·판매가)에 빨간(에러) dot 이 0건인지 확인. 옵션/판매가가 빨가면 그 탭의 빨간 필드 위치를 진단으로 수집해 실패 보고. 업로드 설정/기본 정보 등 무관 탭의 red 는 로그만 남기고 실패로 보지 않음
    expect: 옵션·판매가 탭 빨간 에러 dot 0건
expected: |
  옵션그룹 수가 쿠팡 추천과 일치하고 전부 1:1 매칭됨 + 옵션가 기준 선택됨 +
  에러체크 실행 결과 옵션·판매가 탭 빨간 에러 0건 (무관 탭 red 는 스코프 외).
  unhandled 0건.
