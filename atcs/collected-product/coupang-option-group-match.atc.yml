title: 쿠팡 추천 옵션그룹명 매칭 (그룹수 맞춤 + 이름 매칭 + 옵션가 기준 선택)
priority: P0
description: |
  쿠팡이 추천 옵션그룹명 사용을 필수화함에 따라, 수집상품의 옵션그룹을
  쿠팡 카테고리가 요구하는 추천 옵션그룹(mandatory attributes) 개수에 맞추고
  각 옵션그룹 이름을 추천 Tag 로 1:1 매칭한다.
  - 내 옵션그룹 수 보다 추천 수가 많으면: 옵션그룹 추가로 채움
  - 내 옵션그룹 수 보다 추천 수가 적으면: 초과분 삭제로 줄임
  - 옵션그룹을 추가/변경했다면 판매가 탭에서 옵션가 기준(base SKU) 을 선택
  업로드는 본 TC 가 하지 않음. 큐의 이어지는 업로드 TC 가 진행한다.
  전제: 대상 상품은 아직 업로드되지 않았고, 쿠팡이 업로드 대상 마켓이며,
  쿠팡 카테고리에 필수 노출 속성(추천 옵션그룹)이 존재해야 한다.
inputs:
  source_product_id:
    type: string
    description: 매칭 대상 수집상품의 윈들리 내부 코드. 비우면 목록 첫 카드 사용.
    example: '235442266'
    from: previous
outputs:
  source_product_id:
    type: string
    description: 매칭한 상품 코드 — 이어지는 업로드 TC 가 받아감
steps:
  - id: open_collected_list
    do: 수집상품 목록으로 이동
  - id: open_target_product
    do: source_product_id 가 있으면 상품 코드 검색으로 진입, 없으면 첫 카드 진입. 진입한 상품 코드를 output 으로 발급
  - id: open_option_tab
    do: 상품 상세에서 옵션 탭으로 이동
  - id: ensure_recommend_toggle_on
    do: 쿠팡의 추천 옵션그룹명 사용 토글을 켠다. 이미 켜져 있으면 통과. 토글이 없으면 쿠팡 미타겟 또는 추천 없음으로 보고 실패
    expect: 옵션그룹마다 추천 옵션그룹명 Tag 영역이 노출됨
  - id: match_option_groups
    do: 쿠팡 추천 옵션그룹 수를 읽어 내 옵션그룹 수와 비교한다. 부족하면 옵션그룹 추가, 초과하면 미매칭 그룹 삭제로 개수를 맞춘 뒤, 추천 Tag 를 순서대로 클릭해 첫 추천은 그룹1, 둘째 추천은 그룹2 식으로 1:1 매칭한다. 그 후 각 그룹명을 그룹1, 그룹2 식 중립 라벨로 변경하고, 모든 그룹에 윈들리 A-Z 버튼으로 옵션명을 알파벳 정규화한 뒤, 옵션값을 단위형식·고유성 기준으로 자동보정한다
    expect: 옵션그룹 수가 추천 수와 같고 모든 그룹이 순서대로 매칭됨 + 그룹명(그룹N)/옵션명(A-Z)/옵션값이 채워짐
  - id: select_base_sku
    do: 판매가 탭으로 이동해 옵션가 기준 라디오에서 아무 SKU 나 하나 선택
    expect: 옵션가 기준이 선택되어 옵션가 기준을 선택해주세요 경고가 사라짐
  - id: error_check
    do: 상단 에러체크 버튼을 눌러 에러체크를 실행하고, 탭 dot 상태를 읽어 이 TC 의 책임 탭(옵션·판매가)에 빨간(에러) dot 이 0건인지 확인. 옵션/판매가가 빨가면 그 탭의 빨간 필드 위치를 진단으로 수집해 실패 보고. 업로드 설정/기본 정보 등 무관 탭의 red 는 로그만 남기고 실패로 보지 않음
    expect: 옵션·판매가 탭 빨간 에러 dot 0건
expected: |
  옵션그룹 수가 쿠팡 추천과 일치하고 전부 1:1 매칭됨 + 옵션가 기준 선택됨 +
  에러체크 실행 결과 옵션·판매가 탭 빨간 에러 0건 (무관 탭 red 는 스코프 외).
  unhandled 0건.
