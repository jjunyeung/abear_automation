title: 수집상품 첫 카드 → 상품명 변경 → 영속성 검증 (재업로드 X)

description: |
  수집상품 첫 카드 → 상세 진입 → 페이지 상단 메인 상품명 input 1개만 변경 → onBlur 저장 → page.reload() 후 값 유지되는지로 영속성 검증.

  edit-top-name-reupload 와 달리 재업로드를 트리거하지 않음 — name 저장 자체가 onBlur 로 API 호출되는지만 본다.

inputs: {}

steps:
  - id: open_collected_list
    do: 좌측 사이드바 수집상품 메뉴 클릭하여 /view2/interested-product 진입
  - id: open_first_product
    do: 첫 .product-card 의 detail 링크 클릭하여 /view2/interested-product/<digits> URL 도달
  - id: edit_name
    do: 페이지 상단 (y<600px) 가장 긴 visible textbox = 메인 상품명 input 을 timestamp 이름 으로 교체 + onBlur 발사
  - id: verify_persist_after_reload
    do: page.reload() 후 같은 input 의 value 가 새 이름과 동일한지 확인

expected: 상품명 변경 + 영속성 검증 (재업로드 없음). unhandled 0건.
