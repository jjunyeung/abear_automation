title: 수집상품 첫 카드 → 옵션 탭 → A-Z 정규화 동작 확인

description: |
  수집상품 첫 카드 → 상세 → 옵션 탭 → A-Z 버튼 1개 이상 발견 시 첫 번째만 클릭 + AnchoredModal icon 버튼 클릭 → 페이지 안에 ^[A-Z]+$ 패턴의 input 값이 ≥1 노출되는지로 정규화 적용 확인.

  옵션 그룹이 0개인 상품 (A-Z 버튼 미존재) 은 skip 처리하여 PASS.

inputs: {}

steps:
  - id: open_collected_list
    do: 좌측 사이드바 수집상품 메뉴 클릭
  - id: open_first_product
    do: 첫 .product-card 클릭하여 상세 진입
  - id: apply_a_z
    do: 옵션 탭 → A-Z 버튼 첫 항목 클릭 → AnchoredModal icon 버튼 클릭 → 정규화 적용 확인

expected: 옵션 탭 A-Z 정규화 동작 확인. unhandled 0건.
