# Vertical slice exemplar — R-A1.2
#
# 흐름:
#   (1) 상품 수집  →  (2) 상품 상세 이동  →  (3) 에러체크
#   에러 발견 시 → recoveries/missing_image.ts 로 분기 → 수정 → (3) 에러체크 재시도
#
# 이 파일은 .claude/rules/atc-file-layout.md 의 "올바른 예" 패턴 그대로:
#   - 위치: atcs/<domain>/<name>.atc.yml  (depth 2, domain=collect)
#   - 확장자: .atc.yml
#   - 고정 키 5개만 사용: title, description?, inputs, steps, expected
#   - description 은 사람이 읽는 메모 (GUI InputForm 헤더 아래 표시) — 실행 무영향
#   - inputs 는 schema 만 (D8) — 값은 실행 시 CLI/fixture/env 로 주입
#   - steps[i].do 는 한국어 자연어 (Claude 가 코드로 변환)
#   - on_error 는 recoveries/<id>.ts 와 정확히 매칭되는 키
#   - on_recovery.restart_from 으로 D4 재개 지점 override

title: 상품을 수집하고 에러체크를 수행한다 (vertical slice exemplar)

description: |
  타오바오/티몰/라쿠텐 상품 URL 1건을 받아 윈들리 확장으로 수집하고,
  수집된 상품 상세에서 에러체크까지 수행하는 vertical slice 흐름.

  에러가 발견되면 recoveries/missing_image.ts 로 분기해 자동 보정 후
  같은 step 부터 재개 (on_recovery.restart_from). 마켓 업로드는 하지 않음.

  사용 예: ATC 프레임워크가 정상 동작하는지 빠르게 검증하는 smoke test.

inputs:
  url:
    type: string
    description: 수집할 타오바오/티몰/라쿠텐 상품 URL
    example: https://item.taobao.com/item.htm?id=12345

steps:
  - id: collect
    do: 주어진 url 로 상품 수집을 수행한다 (윈들리 수집 페이지 진입 → URL 입력 → 수집 버튼 클릭 → 완료 대기)

  - id: open_detail
    do: 수집된 상품의 상세 페이지로 이동한다 (수집 결과 목록의 첫 항목 클릭 또는 직접 URL 이동)

  - id: error_check
    do: 상품 상세에서 에러체크를 수행한다 (에러체크 버튼 클릭 → 결과 확인). 에러 발견 시 첫 번째 에러의 error_key 를 반환
    on_error:
      - missing_image
    on_recovery:
      restart_from: error_check

expected: 모든 마켓에 업로드 가능한 상태가 된다 (에러 0건, unhandled 0건)
