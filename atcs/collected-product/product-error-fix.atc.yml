# 수집상품 에러체크 - 모든 탭 순차 진입 + 즉시 수정 (walk-through 접근)
#
# 흐름:
#   (1) 수집상품 메뉴  →  (2) 상품 코드 검색  →  (3) 상세 진입
#   →  (4) 에러체크 1회 트리거 (windly 가 각 탭에 에러 배너/빨간 보더 노출)
#   →  (5) 7개 탭 순차 진입하며 각 탭마다 fixTabErrors 호출 (over-limit / 빨간 배너 / click_button 패턴 자동 수정)
#         → 한 pass 에서 1건이라도 fix 했으면 다음 pass 반복 (max 3 pass)
#   →  (6) 최종 검증 — 에러체크 재실행 후 빨간 탭 0건 확인
#
# 사전조건: setup project (tests/auth.setup.ts) 가 로그인 + 해구대 진입을 완료한 상태.
#
# 입력 (D8):
#   - source_product_id : 윈들리 내부 상품 코드 (수집상품)

title: 수집상품 에러체크 - 모든 탭 순차 walk-through 자동 수정
priority: P2

description: |
  특정 수집상품 (source_product_id 로 지정) 의 에러를 7개 탭 walk-through 로 자동 수정하는 ATC.

  흐름: 수집상품 메뉴 → 상품 코드 검색 → 상세 진입 → 에러체크 1회 트리거 → 7개 탭 순차 진입 + fixTabErrors (over-limit / 빨간 배너 / click_button 자동 수정) → max 3 pass 반복 → 최종 빨간 0건 확인.

  입력: source_product_id (윈들리 내부 상품 코드).
inputs:
  source_product_id:
    type: string
    description: 윈들리 내부 상품 코드 (수집상품 카드의 ID)
    example: '235445363'

steps:
  - id: open_collected_list
    do: 좌측 사이드바 수집상품 메뉴 클릭

  - id: search_product
    do: 상품 코드 검색 모달로 inputs.source_product_id 입력 후 검색하기 클릭

  - id: open_detail
    do: 검색 결과의 첫 번째 상품 카드 클릭하여 상세 페이지 진입

  - id: trigger_error_check
    do: 상단의 에러체크 버튼(체크마크 svg 아이콘) 1회 클릭하여 windly 가 모든 탭의 에러 배너/빨간 보더를 갱신하게 만든다

  - id: walk_tabs_and_fix
    do: 7개 탭(기본 정보 / 이미지 / 옵션 / 판매가 / 상품 속성 / 상세페이지 / 업로드 설정)을 순서대로 클릭하면서 각 탭에 진입할 때마다 fixTabErrors 를 호출. 한 pass 에서 1건이라도 fix 됐으면 다음 pass 반복 (max 3 pass).

  - id: verify_all_clean
    do: 에러체크 버튼을 다시 1회 클릭한 뒤 7개 탭의 dot 색상을 검사하여 빨간색 탭이 0개인지 확인. 빨간 탭이 1개 이상이면 fail (해당 탭 이름 + 에러 메시지 message 에 포함)

expected: walk-through 후 7개 탭 dot 색상에 빨간색 0개. unhandled 0건.
