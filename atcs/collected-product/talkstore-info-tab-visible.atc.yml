# 수집상품 상세 → 기본 정보 탭 → 톡스토어 섹션 노출 확인.
#
# TC 원본 (P0, 1건):
#   - Case No 1072 / 기본 정보 / 수집상품 기본 정보 탭 확인
#
# 코드 출처: windly_repo/sesame/src/features/ProductDetail/
#   - ProductDetail.const.ts L7: { label: '기본 정보', value: 'info' }
#   - ProductDetailTabs/InfoTab/index.tsx L407-420: showTitleForm.talkstore && <TextField label="톡스토어" ... />
#
# 사전조건: 수집상품 ≥ 1개. 톡스토어 마켓이 활성화되어 있어야 톡스토어 TextField 노출
#           (showTitleForm.talkstore=true). 비활성 시 noop 으로 처리 (환경 의존).

title: 수집상품 상세 → 기본 정보 탭 → 톡스토어 섹션 노출 (TC 1072)
priority: P0

description: |
  수집상품 첫 카드 → 상세 진입 → 기본 정보 탭 활성화 → 톡스토어 상품명 TextField label 노출 확인.
  톡스토어 마켓 비활성 환경에서는 InfoTab 의 카테고리 영역 노출만으로 success 처리.
  TC 원본: Case No 1072 / P0

inputs: {}

steps:
  - id: open_first_product_detail
    do: 수집상품 목록 진입 후 첫 카드의 상세 페이지 진입

  - id: click_info_tab
    do: ProductDetail 의 기본 정보 탭 클릭 (기본 활성이면 noop)

  - id: verify_info_tab_loaded
    do: 기본 정보 탭 컨텐츠 노출 확인 - 상품 카테고리 섹션 가시

  - id: verify_talkstore_section_or_skip
    do: 톡스토어 상품명 TextField 또는 톡스토어 카테고리 노출 확인. 마켓 비활성 환경이면 success 로 처리.

expected: 상세 진입 + 기본 정보 탭 활성 + 카테고리 섹션 노출. 톡스토어 섹션은 환경 의존이라 미노출 시 noop. unhandled 0건.
