title: 수집상품 톡스토어 토글 노출

description: |
  수집상품 첫 카드 → 상세 → 업로드 설정 탭 → 톡스토어 토글 노출 검증.
  TC 원본: Case No 1078, 1090 / P0

inputs: {}

steps:
  - id: open_first_collected_product
    do: 수집상품 페이지 진입 → 첫 카드 클릭 → 상세 진입

  - id: click_upload_tab
    do: 업로드 설정 탭 클릭

  - id: wait_for_market_toggles
    do: 업로드 대상 마켓 섹션 노출 대기

  - id: verify_talkstore_toggle_visible
    do: 톡스토어 토글 라벨 노출 검증
    expect: 톡스토어 텍스트가 마켓 토글 섹션에 노출

expected: 톡스토어 토글 가시. unhandled 0건.
