# 임의 수집상품 1개 진입 → 에러체크 버튼 클릭 → 에러체크가 실행되었는지 확인.
#
# 흐름:
#   (1) 수집상품 메뉴  →  (2) 첫 카드 클릭하여 detail 진입
#   →  (3) 에러체크 버튼 (체크마크 svg 아이콘) 클릭
#   →  (4) 7개 탭 dot 상태를 read 하여 ≥1 개가 red/yellow/green 으로 분류되면 ok
#         (= 에러체크가 실제로 실행되어 dot 색상이 update 됨)
#
# 사전조건: setup project (tests/auth.setup.ts) 가 로그인 + 해구대 진입 완료.
#           수집상품 list 에 카드 ≥1 개 존재 (없으면 url-collect 먼저 실행).
#
# 입력: 없음. 첫 카드를 그대로 사용.

title: 임의 수집상품 진입 → 에러체크 트리거 동작 확인
priority: P2

description: |
  임의 수집상품 1개 진입 → 에러체크 버튼 클릭 → 에러체크가 실제로 실행되었는지 (= 7개 탭 dot 색상이 1개 이상 분류됨) 만 확인하는 minimal smoke test.

  수정/세부 진단은 하지 않음.
  입력값 없음 — 첫 카드 사용.
inputs: {}

steps:
  - id: open_collected_list
    do: 좌측 사이드바 수집상품 메뉴 클릭하여 view2/interested-product 진입

  - id: open_first_product
    do: 첫 .product-card 의 detail 링크 클릭하여 view2/interested-product/<digits> URL 도달

  - id: trigger_error_check
    do: 페이지 상단 체크마크 svg 아이콘 버튼 클릭 (에러체크 트리거)

  - id: verify_error_check_ran
    do: 7개 탭(기본 정보 / 이미지 / 옵션 / 판매가 / 상품 속성 / 상세페이지 / 업로드 설정) 의 dot 상태 read. 분류된 (red/yellow/green) 탭 수 ≥1 이면 에러체크 실행 확인.

expected: 4개 step 모두 success, unhandled 0건. 에러체크 후 분류된 탭 ≥1 개.
