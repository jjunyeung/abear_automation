# 수집상품 상세 → 업로드 설정 탭 → ESM 2.0 옵션설정 섹션 노출 (non-destructive).
#
# TC 원본 (P0, 2건):
#   - Case No 826 / esm / 상품수집 후 업로드 설정 확인
#   - Case No 827 / esm / 카테고리 수정 후 업로드 설정 확인
#
# 코드 출처: windly_repo/sesame/src/features/ProductDetail/ProductDetailTabs/UploadTab/UploadTab.tsx
#   - L154: <MarketUploadSettingsTemplate title="공통 업로드 설정"> (항상 노출)
#   - L176-195: ESM 2.0 옵션설정 — uploadMarkets.esm || uploadedMarkets.esm 일 때만 노출
#
# 사전조건: 수집상품 ≥ 1개. 공통 업로드 설정 (always-on) 검증 + ESM 2.0 section 은
# 환경 (esm 마켓 활성) 의존 → 노출 시 PASS, 미노출 시 SKIP message.

title: 수집상품 상세 → 업로드 설정 → 공통+ESM 섹션 노출 (TC 826/827)
priority: P0

description: |
  수집상품 첫 카드 → 상세 진입 → 업로드 설정 탭 활성화 → 공통 업로드 설정 + ESM 2.0 옵션설정
  섹션 노출 확인. ESM 은 마켓 활성화 환경 의존이라 미노출 시 success 로 처리.
  카테고리 수정 (TC 827 본 동작) 은 destructive 라 본 spec 에서 visibility 만 확인.
  TC 원본: Case No 826, 827 / P0.

inputs: {}

steps:
  - id: open_first_product_detail
    do: 수집상품 목록 진입 후 첫 카드의 상세 페이지 진입

  - id: click_upload_tab
    do: ProductDetail 의 업로드 설정 탭 클릭

  - id: verify_common_upload_section
    do: 공통 업로드 설정 섹션 제목 노출 확인 - always-on

  - id: verify_esm_section_or_skip
    do: ESM 2.0 옵션설정 섹션 제목 노출 확인 - 마켓 비활성 환경 시 success 처리

expected: 업로드 설정 탭 진입 + 공통 섹션 노출. ESM 섹션은 환경 의존. unhandled 0건.
