# Tosstoss 신청서 단가×수량 → 총 금액/수량 갱신 검증.
#
# 출처: TC export Case 1411 "상품 금액" (P0)
# 코드 출처: Tosstoss/Price.tsx
#   "총 수량 {totalQuantity} 개" / "총 금액 {totalPrice}"

title: 배송대행지 토스토스 신청서 상품 금액 자동 계산 검증

description: |
  단가 100 + 수량 5 입력 → "총 수량 5 개" + "총 금액" 영역의 숫자 가시.
  TC 원본: Case No 1411 / 배송대행지 › 신청서 작성 › 상품 금액 / P0

inputs: {}

steps:
  - id: open_tosstoss_application
    do: app.windly.cc/view3/delivery-agency/application?agency=tosstoss 직접 이동

  - id: add_manual_form
    do: 수동으로 추가하기 버튼 클릭

  - id: fill_price_qty_verify_sum
    do: 단가 100 + 수량 5 입력 → 총 수량 5 개 텍스트 가시 검증
    expect: 총 수량 5 개 visible

expected: 금액 자동 계산. unhandled 0건.
