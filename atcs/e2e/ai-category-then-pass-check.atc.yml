# C3. AI 카테고리 추천 → 에러체크 통과.

title: AI 카테고리 추천 → 에러체크 카테고리/속성 탭 정상 (e2e)
priority: P1

description: |
  수집상품 첫 카드 → AI 카테고리 추천 → 적용 → 에러체크 → 빨간 카테고리 드롭다운 0개.
  검증 대상은 카테고리만 (기본 정보 탭 전체 dot 아님 — 브랜드/원산지 등 무관 필수값으로도
  탭이 빨개질 수 있어 갓 수집된 첫 카드엔 탭 green 요구가 구조적으로 불가).
  주 1회 회귀.

inputs: {}

steps:
  - id: open_collected_list
    do: 수집상품 목록 진입.
  - id: open_first_product
    do: 첫 카드 상세 진입.
  - id: recommend_category
    do: AI 카테고리 추천 버튼 클릭 + 로딩 종료 대기.
  - id: error_check_after_category
    do: 에러체크 트리거 후 기본 정보 탭의 빨간 카테고리 드롭다운이 있으면 열어 바지 로 검색하고 맨 위 결과를 선택해 채운 뒤 재검사. 그래도 빨간 카테고리가 남으면 진단과 함께 실패.

expected: AI 카테고리 추천(+빨강 시 바지 수동 선택) 후 빨간 카테고리 드롭다운 0개. unhandled 0건.
