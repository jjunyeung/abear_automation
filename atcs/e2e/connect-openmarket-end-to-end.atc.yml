# e2e gap-fill ATC (spec 미구현 — 사용자가 별도 작성 예정).

title: 연결 설정 → 오픈마켓 연결 → 인증 → 연결 확인 (e2e)
priority: P1
description: |
  연결 설정 진입 → 오픈마켓 탭 → 스마트스토어 연결하기 → 인증키 입력 모달 → 연결 완료 → 연결됨 상태 확인.
inputs: {}
steps:
  - id: open_connect_settings
    do: 연결 설정 (/connect?setting=MARKET) 진입.
  - id: open_openmarket_tab
    do: 오픈마켓 연결 탭 선택.
  - id: click_connect_smartstore
    do: 스마트스토어 '연결하기' 클릭.
  - id: enter_auth_key
    do: Open API 인증키 입력 모달에 키 입력 후 연결.
  - id: verify_connected
    do: 스마트스토어가 연결됨 상태로 표시되는지 확인.
expected: 오픈마켓 연결 플로우 정상. unhandled 0건.
