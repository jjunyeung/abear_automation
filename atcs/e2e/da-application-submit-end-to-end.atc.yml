# E2. 배대지 신청서 작성 → 자동결제 카드 → 제출.

title: 배대지 신청서 작성 → 자동결제 카드 → 제출 (e2e)
priority: P1

description: |
  배대지 신청서 진입 → 수동입력 → 자동결제 카드 선택 → 제출 → 신청 완료 (또는 redirect).
  주 1회 회귀. 배대지 매출 직결.

inputs: {}

steps:
  - id: open_tosstoss_application
    do: 배송대행지 신청서 페이지 진입.
  - id: add_manual_form
    do: 수동 입력 폼 추가.
  - id: toggle_auto_payment
    do: 자동결제 토글 ON.
  - id: select_card_radio
    do: 자동결제 방식 = 카드 라디오 선택.
  - id: fill_minimum_fields
    do: 최소 필수 필드 (이름/연락처/주소 등) 채우기.
  - id: submit_and_verify
    do: 제출 버튼 클릭 + 신청 완료 토스트 또는 목록 redirect 확인.

expected: 신청서 제출 성공. unhandled 0건.
