# 배송대행지 메뉴 진입 → "신청서 작성" → 작성 페이지에서 "주문관리에서 불러오기"
# → 주문 1건 선택 → "불러오기" 클릭하여 모달 닫기까지.
#
# 흐름:
#   (1) /view3/delivery-agency 직접 goto. 페이지 헤더 '배송대행지' 타이틀 visible 확인.
#   (2) 페이지 안의 "신청서 작성" primary 버튼 클릭 (Quickstar 탭 Order Header).
#   (3) URL 이 /view3/delivery-agency/application 로 전환되고 페이지가 mount 될 때까지 대기.
#   (4) Quickstar Product Buttons 의 "주문관리에서 불러오기" 버튼 클릭하여 LoadProductModal 오픈.
#   (5) 모달 타이틀 "주문관리에서 상품 정보 불러오기" visible + 주문 리스트 또는 빈 메시지가 mount 될 때까지 대기.
#   (6) 첫 번째 주문 행 (CheckBox) 선택. 빈 메시지 ('불러올 상품이 없어요') 면 fail.
#   (7) 모달의 "불러오기" right primary 버튼 클릭 (선택 0개면 disabled → fail).
#       클릭 후 모달이 닫히는지 확인.
#
# 사전조건:
#   - setup project (tests/auth.setup.ts) 가 로그인 + 해구대 진입 완료.
#   - 계정에 quickstar 배송대행지 1개 이상 연결.
#   - 주문관리에 status=ACCEPT 또는 INSTRUCT 인 receiverType=CUSTOMS 주문이 1건 이상 존재.
#     (LoadProductModal 의 useGetProductOrders 쿼리 조건 — 미존재 시 "불러올 상품이 없어요" 표시)
#
# 코드 출처 (windly-frontend-web):
#   - src/router.tsx:114,118 — 라우트 등록
#   - src/features/DeliveryAgency/index.tsx:26 — Layout title="배송대행지"
#   - src/features/DeliveryAgency/Quickstar/Order/Header/Application.tsx:32-44
#       <Button buttonType="primary">신청서 작성</Button>
#       → navigate('/delivery-agency/application?agency=quickstar')
#   - src/features/DeliveryAgency/hooks/useControlDeliveryAgencyTab.ts:18 — 기본 탭 QUICKSTAR
#   - src/features/DeliveryAgencyApplication/Quickstar/Product/Buttons.tsx:18
#       <Button buttonType="secondary">주문관리에서 불러오기</Button>
#   - src/features/DeliveryAgencyApplication/Quickstar/Product/modals/LoadProductModal/index.tsx
#       title="주문관리에서 상품 정보 불러오기", rightButtonText="불러오기"
#       rightButtonDisabled={currentOrderList.length <= 0}
#   - .../LoadProductModal/List/Item.tsx — Container onClick 으로 row 자체에서 선택 토글.
#       내부 <CheckBox checked={active}/> 로 input[type=checkbox] 렌더.
#   - .../LoadProductModal/List/index.tsx — productOrders.length<=0 시 "불러올 상품이 없어요"

title: 배송대행지 → 신청서 작성 → 카테고리 선택 → 동의 → 신청 완료 + 메인 화면 랜딩

description: |
  배송대행지 메뉴 → "신청서 작성" 버튼 → 작성 페이지 진입 → "주문관리에서 불러오기" → 첫 번째 주문 선택 → "불러오기" 클릭하여 모달 닫힘까지 e2e 검증.

  배송대행지 신청 흐름의 LoadProductModal 동작이 정상인지 보는 ATC.

  사전조건: quickstar 배송대행지 1+ 연결 + ACCEPT/INSTRUCT 상태의 receiverType=CUSTOMS 주문이 1+ 존재해야 함 (없으면 모달이 "불러올 상품이 없어요" 표시 → fail).
  입력값 없음.
inputs: {}

steps:
  - id: open_delivery_agency
    do: app.windly.cc/view3/delivery-agency 로 직접 goto. SPA hydrate 안정화 대기. 페이지 Layout title 배송대행지 가 visible 인지 확인.
    expect: URL 이 /view3/delivery-agency 경로에 도달하고 배송대행지 타이틀이 visible.

  - id: click_apply_form
    do: 페이지 안의 신청서 작성 primary 버튼을 클릭. Quickstar Order Header — 기본 탭. 동일 텍스트 버튼이 여러 곳에 있을 수 있으므로 visible 한 첫 매치 클릭.
    expect: 버튼 클릭 성공.

  - id: wait_application_page
    do: URL 이 /view3/delivery-agency/application 로 전환될 때까지 최대 30초 대기. SPA mount 안정화 후 페이지 안에 텍스트가 1개 이상 visible 인지 확인 (페이지가 죽지 않았는지).
    expect: URL 이 /view3/delivery-agency/application 매치. 페이지가 정상 mount.

  - id: click_load_from_orders
    do: 신청서 페이지의 주문관리에서 불러오기 버튼 클릭하여 LoadProductModal 오픈.
    expect: 버튼 클릭 성공.

  - id: wait_load_modal
    do: 모달 타이틀 (주문관리에서 상품 정보 불러오기) 가 visible 될 때까지 대기. 그 후 주문 리스트 (input[type=checkbox] 1개 이상) 또는 빈 메시지 (불러올 상품이 없어요) 가 mount 될 때까지 최대 15초 폴링.
    expect: 모달 mount 완료 — 주문 리스트 또는 빈 메시지 둘 중 하나가 표시.

  - id: select_first_order
    do: 모달 안 첫 번째 주문 행의 CheckBox 클릭하여 선택. 빈 메시지 (불러올 상품이 없어요) 가 visible 이면 즉시 fail.
    expect: 첫 행이 선택되어 active 상태가 됨.

  - id: click_load_button
    do: 모달의 불러오기 right primary 버튼 클릭. 버튼이 disabled 면 fail (선택 0개). 클릭 후 모달 타이틀이 hidden 될 때까지 최대 15초 대기.
    expect: 불러오기 클릭 성공 + 모달이 닫힘.

  - id: open_category_dropdown
    do: 신청서 폼의 첫 번째 상품 카테고리(HS) Dropdown 트리거 버튼 클릭하여 옵션 박스 오픈. 라벨 텍스트 (상품 카테고리(HS)) 가 visible 될 때까지 최대 20초 대기 후 closest 조상 div 의 button 클릭.
    expect: 드롭다운 옵션 박스 오픈됨 (검색 input visible).

  - id: search_chair_in_category
    do: 드롭다운 옵션 박스 안 검색 input (placeholder=검색하기) 에 의자 입력. debounce 500ms + API 응답 대기. 결과 옵션이 1개 이상 mount 되거나 검색 결과 없음 메시지가 뜰 때까지 최대 10초.
    expect: 의자가 포함된 옵션 label 1개 이상 mount.

  - id: select_first_category_result
    do: 검색 결과의 첫 번째 옵션 label 을 클릭. label semantics 로 BaseOption(radio) 토글 + onChange 에서 setShow(false) 호출되어 드롭다운 자동 닫힘. 검색 input hidden 으로 검증.
    expect: 옵션 선택됨 + 드롭다운 닫힘.

  - id: agree_caution
    do: 신청서 페이지 스크롤을 맨 밑으로 내려서 주의사항 확인 섹션 visible. 동의 체크박스의 부모 label (CheckBoxContainer, label 텍스트 = 모든 내용을 확인했으며, 주의사항에 동의합니다.) 클릭. 신청 완료 버튼이 disabled 에서 enabled 로 전환되는 것까지 검증 (최대 5초).
    expect: 동의 체크박스 선택됨 + 신청 완료 버튼 enabled.

  - id: click_submit_and_land
    do: 신청 완료 버튼 1회 클릭 후 URL 이 /view3/delivery-agency (단 /application 은 제외) 로 전환될 때까지 최대 30초 대기. WS1014 토스트 발생 시 즉시 fail 로 백엔드 이슈 신호 (재시도 안 함 — 자동 retry 는 진짜 백엔드 정상화 여부를 가림). bug-report-delivery-agency-WS1014.md 참조.
    expect: 신청 완료 클릭 + 배송대행지 메인 화면으로 랜딩.

expected: 12개 step 모두 success, unhandled 0건. 배송대행지 → 신청서 작성 → 카테고리 선택 → 동의 → 신청 완료 → 배송대행지 메인 화면 랜딩까지.
