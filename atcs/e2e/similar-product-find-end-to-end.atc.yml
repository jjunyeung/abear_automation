# e2e gap-fill ATC (spec 미구현 — 사용자가 별도 작성 예정).

title: 인기 상품 추천 → 상품 카드 → 비슷한 상품 찾기 모달 → 수집 (e2e)
priority: P2
description: |
  인기 상품 추천 페이지 → 상품 카드 → '이 상품과 비슷한 상품 찾기' 모달 → 결과 → 수집.
inputs: {}
steps:
  - id: open_recommend_page
    do: 인기 상품 추천 페이지 진입.
  - id: pick_product_card
    do: 상품 카드 선택.
  - id: open_similar_modal
    do: 비슷한 상품 찾기 버튼 클릭 → 모달.
  - id: verify_similar_results
    do: 유사 상품 결과 리스트 확인.
  - id: collect_similar
    do: 결과에서 상품 수집 트리거.
expected: 유사상품 찾기 플로우 정상. unhandled 0건.
