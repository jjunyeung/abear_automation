# 상품 속성 base setting 변경 → bulk-apply → 첫 상품 상품 속성 탭 매치 검증.
#
# 사전조건: setup project 가 로그인 + 해구대 진입 완료.
#
# 흐름:
#   (1) /view3/base-setting?setting=COMMON&category=PRODUCT_ATTRIBUTE 진입
#       → 제조사 / 브랜드 input 을 unique value (TC제조사_<ts> / TC브랜드_<ts>) 로 변경
#       → 미성년자 구매 Dropdown 을 cycle (가능 ↔ 불가능) 변경
#       → snapshot = 변경 후 값.
#   (2) /view2/interested-product 진입.
#   (3) 첫 카드 1개 체크 + 기본 설정값 적용 → success toast.
#   (4) 첫 카드 클릭 → 상품 상세.
#   (5) 상품 속성 탭 클릭 → CommonAttributes 노출.
#   (6) 상품 속성 탭의 제조사 / 브랜드 input value + 미성년자 구매 Dropdown selected 추출 → snapshot 매치 검증.
#
# 라벨 매핑 (windly base setting ↔ sesame 상품 detail):
#   defaultManufacturer ↔ manufacturer.value: "제조사" ↔ "제조사"
#   defaultBrand        ↔ brand.value:        "브랜드" ↔ "브랜드"
#   adultOnly           ↔ productAdultOnly:   "미성년자 구매" 라벨 + selected "가능"/"불가능"
#
# bulk-apply 적용 확인 (BulkSyncBaseSetting.tsx):
#   manufacturer.value <- baseSetting.defaultManufacturer
#   brand.value        <- baseSetting.defaultBrand
#   productAdultOnly   <- baseSetting.adultOnly
#   3개 모두 적용됨.

title: 상품 속성 base setting 변경 후 첫 수집상품 상품 속성 탭 매치 검증

description: |
  상품 속성 base setting (제조사 / 브랜드 / 미성년자 구매) 변경 → bulk-apply → 첫 수집상품 상품 속성 탭 매치 검증.

  흐름: /view3/base-setting?category=PRODUCT_ATTRIBUTE → 제조사 / 브랜드 input 을 unique 값 (TC제조사_<ts> / TC브랜드_<ts>) 으로 변경 + 미성년자 구매 Dropdown cycle → snapshot → 수집상품 첫 카드 체크 + bulk-apply → success toast → 첫 카드 상세 → 상품 속성 탭 → 3개 필드 추출 → snapshot 매치.

  라벨 매핑: defaultManufacturer ↔ manufacturer.value, defaultBrand ↔ brand.value, adultOnly ↔ productAdultOnly.
  입력값 없음.
inputs: {}

steps:
  - id: bump_and_snapshot_attribute
    do: app.windly.cc/view3/base-setting?setting=COMMON&category=PRODUCT_ATTRIBUTE 직접 goto. 제조사 input 을 unique 값 (TC제조사_<ts>) 으로 fill, 브랜드 input 을 unique 값 (TC브랜드_<ts>) 으로 fill, 미성년자 구매 Dropdown 의 selected 추출 후 cycle 옵션 (가능 ↔ 불가능) 으로 변경. 모두 onBlur/click 후 snapshot 저장.
    expect: 3개 필드 변경 + reformat 반영

  - id: open_collected_list
    do: 수집상품 목록 (/view2/interested-product) 진입.

  - id: apply_base_setting_to_first
    do: 첫 카드 1개 체크 → 상단 More(...) → 기본 설정값 적용 → 모달 적용 클릭 → success toast 대기.
    expect: success toast 노출

  - id: enter_first_product
    do: 수집상품 첫 카드 클릭. 상세 URL 도달.

  - id: open_attribute_tab
    do: 상품 상세에서 상품 속성 탭 클릭. CommonAttributes (제조사 / 브랜드 / 미성년자 구매 input/dropdown) 노출 대기.
    expect: 상품 속성 탭 active + 제조사 input DOM 마운트

  - id: verify_attribute_on_product
    do: 제조사 input value / 브랜드 input value / 미성년자 구매 Dropdown selected 추출 → snapshot 의 3개 값과 매치 검증.
    expect: 3개 모두 매치

expected: 제조사 / 브랜드 / 미성년자 구매 가 글로벌 base setting 과 일치. unhandled 0건.
