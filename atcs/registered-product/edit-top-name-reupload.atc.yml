# 등록상품 첫 카드 → 상세 → 상품명 timestamp 기반으로 변경 → 재업로드.
#
# edit-name-reupload 변형:
#   - source_product_id 입력 안 받음 (검색 step 없음, 첫 카드 사용)
#   - new_name 자동 생성: "상품명 수정 (YYYY-MM-DD HH:MM:SS)"
#
# 흐름:
#   (1) 등록상품 메뉴 → (2) 첫 카드의 상품 이름 클릭하여 상세 진입
#   → (3) 기본/마켓별 상품명 input 일괄 교체 (자동생성 timestamp 이름)
#   → (4) 업로드 트리거 → (5) 진행 모달 클릭 (2단)
#   → (6) 업로드 결과 (마켓별 성공/실패 또는 토스트) 안정화 대기
#
# 사전조건: setup project (tests/auth.setup.ts) 가 로그인 + 해구대 진입 완료.
#           등록상품 list 에 카드 ≥1 개 존재 (없으면 url-collect-and-ai-fix 등으로 먼저 생성).
#
# 입력: 없음. 첫 카드 + 자동생성 이름.

title: 등록상품 첫 카드 → 상품명 timestamp 변경 → 재업로드

description: |
  edit-name-reupload 의 변형. source_product_id 입력 없이 등록상품 첫 카드를 자동 선택하고, new_name 도 자동 생성 ("상품명 수정 (YYYY-MM-DD HH:MM:SS)").

  흐름: 등록상품 → 첫 카드 클릭 → 상세 → 페이지 상단 영역의 가장 긴 visible textbox (= 기본 상품명 input) 만 timestamp 이름으로 교체 (마켓별/카테고리 input 은 절대 안 건드림) → 재업로드 → 진행 모달 2단 → 업로드 결과 안정화 대기.

  입력값 없음 — 첫 카드 + 자동생성 이름.
  사전조건: 등록상품에 카드 ≥1 개.
inputs: {}

steps:
  - id: open_registered_list
    do: 좌측 사이드바 등록상품 메뉴 클릭하여 view2/registered-product 진입

  - id: open_top_product
    do: 첫 a[href*=view2/registered-product/] 카드 클릭하여 detail URL 도달

  - id: edit_name
    do: 페이지 상단 (y<600px) 영역의 가장 긴 visible textbox = 기본 상품명 input 으로 식별. 그 input 1개만 자동생성된 상품명 수정 (오늘날짜시간) 으로 교체. 마켓별 input / 카테고리 등 인접 요소는 절대 건드리지 않음. blur 명시 발사로 onBlur 트리거.

  - id: trigger_upload
    do: 상단 체크마크 svg 오른쪽 업로드 아이콘 클릭

  - id: confirm_upload_modal
    do: 상품 업로드 유의사항 확인 / 업로드 마켓 선택 등 모달의 진행 버튼 (업로드 하기/수정 업로드/확인 등) 을 사이클별로 클릭 (최대 4 사이클).

  - id: wait_upload_complete
    do: 업로드 진행 모달의 마켓별 성공/실패 텍스트 안정화 OR 우하단 토스트 출현까지 대기 (최대 180초). 성공 ≥1 또는 토스트 성공이면 ok.

expected: 상품명이 timestamp 기반 새 이름으로 변경되고 ≥1 마켓 재업로드 성공. unhandled 0건.
