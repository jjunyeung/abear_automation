# 등록상품 삭제 모달 노출 검증.
#
# TC 원본: Case No 921 / 등록상품 › 상품 삭제 › 상품 삭제 버튼 선택 / P0
#         Case No 924 / 등록상품 › 상품 삭제 › 모든 스토어에서 상품 삭제 / P0
#         (두 케이스의 expect 가 같음 — 모달 노출 + 마켓 7종 + 취소/삭제 버튼)
#
# 코드 출처: sesame/src/features/RegisteredProduct/RegisteredProduct.tsx:430
#   <Button color="red" onClick={handleDeleteClick}><DeleteIcon/>상품 삭제</Button>
# sesame/src/components/organisms/Modals/Product/DeleteRegisteredProductsModal/index.tsx
#   title="등록상품 삭제", 7개 마켓 체크박스, leftButton="취소", rightButton="삭제"

title: 등록상품 삭제 모달 노출 검증
priority: P0

description: |
  등록상품 첫 페이지 전체 선택 → 상품 삭제 버튼 클릭 → 삭제 모달 노출 검증.
  실제 삭제는 트리거하지 않고 취소로 닫음.
  TC 원본: Case No 921, 924 / P0 (모달 노출 검증 동일 시나리오)

inputs: {}

steps:
  - id: open_registered_list
    do: 등록상품 목록 페이지 진입

  - id: select_first_product
    do: 헤더 전체 선택 체크박스 클릭하여 1페이지 상품 모두 선택

  - id: click_delete_button
    do: 툴바의 상품 삭제 버튼 클릭

  - id: verify_delete_modal
    do: 삭제 모달 노출 검증 (타이틀, 마켓 체크박스 7종, 취소/삭제 버튼)
    expect: 등록상품 삭제 모달 노출. 취소 + 삭제 버튼 가시.

  - id: close_modal
    do: 취소 버튼 클릭하여 모달 닫음

expected: 모달 노출 + 닫힘. 실제 삭제는 발생하지 않음.
