# 등록상품 맨 위 상품의 활성 마켓 아이콘 → 새창 열기 검증
#
# 목적:
#   업로드된 상품(등록상품) 중 가장 최근에 올라온 상품(목록 맨 위)에서
#   활성화(점등)된 오픈마켓 아이콘이 실제로 클릭 가능하고, 클릭 시
#   해당 외부 마켓 도메인으로 새 탭이 열리는지 확인.
#
# 흐름:
#   (1) 등록상품 메뉴 진입
#   → (2) 맨 위 카드의 활성 마켓 아이콘 수집 + 각 클릭 → 새 탭 외부 도메인 검증
#
# 사전조건: setup project (tests/auth.setup.ts) 가 로그인 + 해구대 진입을 완료한 상태.

title: 등록상품 맨 위 상품의 활성 마켓 아이콘 클릭 → 외부 마켓 새창 열림 검증
priority: P2

description: |
  등록상품 목록 맨 위 상품의 활성화(점등)된 마켓 아이콘들을 하나씩 클릭하여, 클릭마다 외부 마켓 도메인 (스마트스토어/쿠팡/11번가/톡스토어/인터파크/롯데온 등) 의 새 탭이 열리는지 검증.

  활성 아이콘 0개거나, 새 탭 미열림, 또는 windly 자체 도메인이면 fail.
  입력값 없음 — 맨 위 상품 자동 사용.
inputs: {}

steps:
  - id: open_registered_list
    do: 좌측 사이드바 등록상품 메뉴 클릭하고 목록이 노출될 때까지 대기

  - id: verify_top_product_market_icons
    do: 등록상품 목록 맨 위 카드 행에서 활성화(점등)된 오픈마켓 아이콘들을 수집한 뒤 하나씩 클릭하여 새 탭이 외부 마켓 도메인(스마트스토어/쿠팡/11번가/톡스토어/인터파크/롯데온 등)으로 열리는지 검증. 활성 아이콘 0개거나 새 탭 미열림 또는 windly 자체 도메인이면 실패.

expected: 맨 위 등록상품의 활성 마켓 아이콘이 1개 이상이고, 각 아이콘 클릭 시 외부 마켓 도메인의 새 탭이 열린다. unhandled 0건.
