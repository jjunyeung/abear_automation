# 등록상품 → 1개 선택 → "수정 업로드" 버튼 → 모달 1단계의 노란 안내 배너 검증.
#
# 출처: TC export Case 3576 "수정 업로드 안내 배너 문구가 정상 노출된다" (P0)
# 화면 / 코드 출처 (sesame view2):
#   src/features/RegisteredProduct/RegisteredProduct.tsx          → "수정 업로드" 버튼 (line 401)
#   src/features/RegisteredProduct/BulkEditModal/index.tsx        → 모달 컨테이너
#   src/features/RegisteredProduct/BulkEditModal/StepChoiceMarket/
#     index.tsx 의 WarningMessageContainer (className="banner")    → 노란 배너
#     원문: "업로드된 마켓에만 상품 정보가 업데이트됩니다."
#
# 사전조건: setup project (tests/auth.setup.ts) 가 로그인 + 해구대 진입을 완료한 상태.
#           등록상품 1건 이상 존재 (inputs.source_product_id 로 검색해서 찾는다).

title: 등록상품 수정 업로드 모달 1단계 안내 배너 노출 검증

description: |
  등록상품 페이지에서 상품 1건 체크 → "수정 업로드" 버튼 클릭 → 모달 1단계의 노란 안내 배너 노출 검증.
  배너 문구가 "업로드된 마켓에만 상품 정보가 업데이트됩니다." 로 시작하는지 확인.

  TC 원본: Case No 3576 / 등록상품 › 수정 업로드 › 안내 배너 문구 / P0
  배너가 안 보이거나 다른 문구면 fail.

inputs: {}

steps:
  - id: open_registered_list
    do: 좌측 사이드바 등록상품 메뉴 클릭하여 view2/registered-product 진입

  - id: select_first_product
    do: 등록상품 목록 첫 번째 카드의 체크박스 선택 (특정 ID 검색 없이 가장 위 상품 1건)

  - id: click_bulk_edit_button
    do: 화면 상단의 수정 업로드 버튼 클릭 (체크 후 활성화 되어야 함)

  - id: verify_banner_notice
    do: 수정 업로드 모달 1단계의 노란 안내 배너가 보이고 "업로드된 마켓에만 상품 정보가 업데이트됩니다" 문구가 포함되어 있는지 검증
    expect: 모달 안 className "banner" 영역에 해당 문구 노출

expected: 수정 업로드 모달 1단계가 열리고 안내 배너 + 정확한 문구 노출. unhandled 0건.
