title: 등록상품 수정 업로드 스스 관부가세 화면 진입 검증
priority: P0

description: |
  step1 스마트스토어 선택 + step2 관부가세 선택 + 다음 → step3 관부가세 화면.
  TC 원본: Case No 3593 / 등록상품 › 수정 업로드 › 스마트스토어 관부가세 진입 / P0

inputs: {}

steps:
  - id: open_registered_list
    do: 좌측 사이드바 등록상품 메뉴 클릭하여 view2/registered-product 진입

  - id: select_first_product
    do: 등록상품 목록 헤더의 전체 선택 체크박스 클릭

  - id: click_bulk_edit_button
    do: 화면 상단의 수정 업로드 버튼 클릭

  - id: select_only_smartstore
    do: step1 에서 스마트스토어 라벨만 선택 후 다음 → step2 진입

  - id: select_customs_tax_form
    do: step2 에서 관부가세 라디오 선택 후 다음 → step3 진입

  - id: verify_customs_tax_accordion
    do: step3 의 관부가세 Accordion title 가시 검증
    expect: 관부가세 텍스트 가시

expected: step3 관부가세 화면 진입. unhandled 0건.
