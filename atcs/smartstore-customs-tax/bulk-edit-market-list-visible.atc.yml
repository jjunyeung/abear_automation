# 수정 업로드 모달 1단계의 마켓 목록 (체크박스 그리드) 가 정상 노출되는지 검증.
#
# 출처: TC export Case 3578 "수정 업로드 대상 마켓 목록이 정상 노출된다" (P0)
# 코드 출처 (sesame view2):
#   StepChoiceMarket/index.tsx → CheckBoxGrid 안에 marketKeys 순회로 마켓 체크박스 렌더.
#   marketKeyToLabel: "스마트스토어", "쿠팡", "11번가", "톡스토어", "롯데온" 등.
#
# 사전조건: setup project 로 로그인 + 해구대 진입 + 등록상품 1건 이상.

title: 등록상품 수정 업로드 모달 1단계 마켓 목록 노출 검증

description: |
  수정 업로드 모달 1단계에 마켓 체크박스가 ≥2개 노출되는지 검증 (전체선택 외).

  TC 원본: Case No 3578 / 등록상품 › 수정 업로드 › 마켓 목록 노출 / P0
  .base-checkbox 개수 ≥ 3 (전체선택 1 + 마켓 ≥2) 이고 한국어 마켓명 ≥1개 가시.

inputs: {}

steps:
  - id: open_registered_list
    do: 좌측 사이드바 등록상품 메뉴 클릭하여 view2/registered-product 진입

  - id: select_first_product
    do: 등록상품 목록 헤더의 전체 선택 체크박스 클릭

  - id: click_bulk_edit_button
    do: 화면 상단의 수정 업로드 버튼 클릭

  - id: verify_market_list_visible
    do: 수정 업로드 모달 1단계의 마켓 체크박스 ≥2개 + 한국어 마켓명 ≥1개 노출 검증
    expect: .base-checkbox 총 ≥3개, ("스마트스토어"|"쿠팡"|"11번가"|"톡스토어"|"롯데온") 중 ≥1개 가시

expected: 마켓 목록 노출. unhandled 0건.
