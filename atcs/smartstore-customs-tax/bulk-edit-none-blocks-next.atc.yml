# 수정 업로드 모달 1단계에서 마켓 선택 없으면 다음 버튼 비활성 검증.
#
# 출처: TC export Case 3583 "마켓을 선택하지 않으면 다음 단계로 진행할 수 없다" (P0)
# 코드 출처 (sesame view2):
#   BulkEditModal/index.tsx:
#     const isNextStepUnavailable = { 1: selected.market.length === 0, ... }[currentStep];
#   → step1 에서 selected.market 비어있으면 다음 버튼 disabled.

title: 등록상품 수정 업로드 모달 마켓 미선택 시 다음 버튼 비활성 검증
priority: P0

description: |
  모달 진입 직후 (selected.market = []) 의 다음 버튼이 disabled 인지 확인.
  TC 원본: Case No 3583 / 등록상품 › 수정 업로드 › 선택 없음 예외 / P0

inputs: {}

steps:
  - id: open_registered_list
    do: 좌측 사이드바 등록상품 메뉴 클릭하여 view2/registered-product 진입

  - id: select_first_product
    do: 등록상품 목록 헤더의 전체 선택 체크박스 클릭

  - id: click_bulk_edit_button
    do: 화면 상단의 수정 업로드 버튼 클릭

  - id: verify_next_disabled
    do: 모달 진입 직후 (마켓 미선택) 다음 버튼이 disabled 상태인지 검증
    expect: 모달 다음 버튼 isDisabled true

expected: 마켓 미선택 시 다음 버튼 비활성. unhandled 0건.
