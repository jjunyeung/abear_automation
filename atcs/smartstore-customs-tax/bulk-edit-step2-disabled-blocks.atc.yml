# 수정 업로드 모달 step2 비활성 라디오 선택 제한 검증.
#
# 출처: TC export Case 3602 "비활성 수정 항목은 선택할 수 없다" (P0)
# 코드 출처 (sesame view2):
#   Radio.tsx: const onSelect = ... if (disabled) return; → disabled 시 setSelectedValue 호출 안 됨.
#   StepChoiceForm: checkDisableForm 이 smartStore* form 들을 마켓 선택에 따라 disabled.

title: 등록상품 수정 업로드 모달 step2 비활성 라디오 선택 제한 검증

description: |
  step2 의 비활성 라디오 클릭 시도해도 selected.form 안 바뀌어 다음 버튼 disabled 유지.

  TC 원본: Case No 3602 / 등록상품 › 수정 업로드 › 비활성 항목 선택 제한 / P0
  사용자 환경의 마켓 연결 상태에 따라 disabled radio 가 없을 수 있음 — 그 경우 fail.

inputs: {}

steps:
  - id: open_registered_list
    do: 좌측 사이드바 등록상품 메뉴 클릭하여 view2/registered-product 진입

  - id: select_first_product
    do: 등록상품 목록 헤더의 전체 선택 체크박스 클릭

  - id: click_bulk_edit_button
    do: 화면 상단의 수정 업로드 버튼 클릭

  - id: enter_step2
    do: step1 전체선택 + 다음으로 step2 진입

  - id: verify_disabled_blocks
    do: step2 비활성 라디오 클릭 시도 후 다음 버튼 disabled 유지 검증
    expect: disabled radio ≥1 존재 + 클릭 후 다음 disabled

expected: 비활성 항목은 선택 안 됨. unhandled 0건.
