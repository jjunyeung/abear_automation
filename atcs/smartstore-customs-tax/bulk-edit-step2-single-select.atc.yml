# 수정 업로드 모달 2단계 라디오 단일 선택 동작 검증.
#
# 출처: TC export Case 3589 "수정 항목을 단일 선택할 수 있다" (P0)
# 코드 출처 (sesame view2):
#   StepChoiceForm/index.tsx → <Radio value={form.value} selectedValue={selectedForm} ... />
#   클릭 시 setBulkEditFormValue(form) → selectedForm = form.value.

title: 등록상품 수정 업로드 모달 2단계 단일 선택 동작 검증
priority: P0

description: |
  step2 진입 → 첫 EditForm 라벨 클릭 → 다음 버튼이 enabled 로 전환 검증.
  TC 원본: Case No 3589 / 등록상품 › 수정 업로드 › 수정 항목 단일 선택 / P0

inputs: {}

steps:
  - id: open_registered_list
    do: 좌측 사이드바 등록상품 메뉴 클릭하여 view2/registered-product 진입

  - id: select_first_product
    do: 등록상품 목록 헤더의 전체 선택 체크박스 클릭

  - id: click_bulk_edit_button
    do: 화면 상단의 수정 업로드 버튼 클릭

  - id: enter_step2
    do: step1 전체선택 + 다음으로 step2 진입

  - id: verify_step2_single_select
    do: 첫 EditForm 라벨 클릭 시 다음 버튼 enabled 로 전환 검증
    expect: 클릭 전 disabled, 클릭 후 enabled

expected: 라디오 단일 선택 동작. unhandled 0건.
