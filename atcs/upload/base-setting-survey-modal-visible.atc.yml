title: 기본설정 추천 설문 모달 노출
priority: P2

description: |
  기본설정 진입 → SurveyBanner 의 "기본설정을 추천" 링크 클릭 → SurveyModal 노출 검증.
  TC 원본: Case No 1222, 1223 / P0
  환경 의존: 무료체험 고객 (isFreePlan=true) 가 아니면 banner 자체 X.

inputs: {}

steps:
  - id: goto_base_setting
    do: 기본설정 진입

  - id: verify_survey_modal_or_banner
    do: Survey modal 자동 노출 또는 banner 기본설정을 추천 링크 클릭 → modal 노출 확인
    expect: 나에게 알맞는 설정 추천받기 텍스트 + 괜찮아요/좋아요 버튼 노출

expected: Survey modal 노출. unhandled 0건.
