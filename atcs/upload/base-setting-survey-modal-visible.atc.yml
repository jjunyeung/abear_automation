# 기본설정 추천 설문 모달 진입.
#
# TC 원본:
#   - Case No 1222 / 업로드 › 업로드 스토어 › 상하단 이미지 / P0 (기본설정 접속 → 추천 팝업)
#   - Case No 1223 / 업로드 › 업로드 스토어 › 상하단 이미지 / P0 (팝업 내용 확인)
