# 등록상품 → 같은 상품 상세 → 상품명 변경 → 재업로드 → 모달 확인
#
# 흐름:
#   (1) 등록상품 메뉴 → (2) 상품 코드 검색 → (3) 첫 카드로 상세 진입
#   → (4) 상품명 input 을 inputs.new_name 으로 변경
#   → (5) 업로드 트리거 (단일 업로드 spec 과 동일 — 체크마크 오른쪽 아이콘)
#   → (6) "상품 업로드 유의사항 확인" 모달에서 업로드 진행 측 버튼 클릭
#   → (7) 업로드 진행 모달의 성공/실패 텍스트 안정화 대기
#
# 사전조건: setup project (tests/auth.setup.ts) 가 로그인 + 해구대 진입을 완료한 상태.

title: 등록상품 상세 상품명 수정 후 재업로드 + 모달 진행 확인

description: |
  등록상품 → 상품 코드 검색 → 상세 진입 → 상품명 input 변경 → 재업로드 → "상품 업로드 유의사항 확인" 모달 진행 → 업로드 결과 텍스트 안정화까지 검증.

  기존 등록상품의 상품명 수정 후 재업로드 흐름이 정상 동작하는지 보는 회귀.

  입력: source_product_id (등록상품 검색용 ID), new_name (변경할 상품명).
inputs:
  source_product_id:
    type: string
    description: 윈들리 내부 상품 코드 (등록상품 검색용)
    example: '235444090'
  new_name:
    type: string
    description: 상세 상품명 input 에 입력할 새 값
    example: 수정한 상품명

steps:
  - id: open_registered_list
    do: 좌측 사이드바 등록상품 메뉴 클릭

  - id: search_product
    do: 상품 코드 검색 모달로 inputs.source_product_id 입력 후 검색하기 클릭

  - id: open_detail
    do: 검색 결과의 첫 번째 등록상품 카드 클릭하여 상세 페이지 진입

  - id: edit_name
    do: 상품 상세에서 기본 상품명 + 마켓별 모든 상품명 input/textarea 를 inputs.new_name 으로 일괄 교체. 원본 상품명을 첫 번째 textbox 에서 식별 → 동일 값 또는 동일 prefix 를 가진 모든 textbox 를 찾아 각각 clear 후 새 값 입력 + blur

  - id: trigger_upload
    do: 상단 체크마크 오른쪽 업로드 아이콘 클릭

  - id: confirm_upload_modal
    do: 상품 업로드 유의사항 확인 모달이 뜨면 업로드 성공 쪽 버튼(업로드 하기/수정 업로드/확인/계속/진행 등) 클릭

  - id: wait_upload_complete
    do: 업로드 진행 모달의 성공/실패 텍스트 안정화 또는 우하단 토스트가 검출될 때까지 대기. 토스트가 실패 메시지면 fail, 성공이면 pass. 진행 모달이 있는 경우 1개 이상 마켓 성공이어야 pass.

expected: 모든 상품명 필드가 새 값으로 바뀌고 재업로드가 마켓 측에서 성공한다. unhandled 0건.
