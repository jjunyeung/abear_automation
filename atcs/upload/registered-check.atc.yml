# 등록상품 단독 검증 — 이미 업로드된 상품이 등록상품 목록에 있는지 확인.
#
# 흐름:
#   (1) 등록상품 메뉴 → (2) 상품 코드 검색
#
# 사전조건: setup project (tests/auth.setup.ts) 가 로그인 + 해구대 진입을 완료한 상태.

title: 등록상품 목록에서 특정 상품 코드 존재 확인

description: |
  특정 상품 코드가 등록상품 목록에 존재하는지만 단독 검증하는 minimal ATC.

  흐름: 등록상품 메뉴 → 상품 코드 검색 → 결과 1개 이상 확인.

  업로드를 직접 트리거하지 않고, 다른 ATC (single-product 등) 가 업로드 한 결과를 사후 확인할 때 사용.
  입력: source_product_id.
inputs:
  source_product_id:
    type: string
    description: 윈들리 내부 상품 코드 (등록상품 목록에서 검색할 ID)
    example: '235442266'

steps:
  - id: open_registered_list
    do: 좌측 사이드바 등록상품 메뉴 클릭

  - id: verify_in_registered
    do: 등록상품 페이지에서 inputs.source_product_id 로 검색 → 결과 1개 이상 확인

expected: 등록상품 목록에서 해당 상품 코드 1개 이상 매칭. unhandled 0건.
